<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒米の系図</title>
<style>
:root{
  --bg:#F7F3EA; --ink:#2A2724; --mute:#8C857B; --line:#DDD5C6;
  --mom:#B8432F; --dad:#2F4C7A; --unk:#8C857B; --sel:#5E7A45; --alt:#C27A2C;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{padding:14px 0 4px}
header.top h1{margin:0;font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.08em}
header.top p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.search input{width:100%;height:44px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.search input:focus{outline:2px solid var(--dad);outline-offset:-1px}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-top:none;max-height:70vh;overflow-y:auto;margin:0;padding:0;list-style:none}
.sugg[hidden]{display:none}
.sugg li.h{padding:8px 12px 4px;font-size:13px;color:var(--mute)}
.sugg li.none{padding:12px;color:var(--mute)}
.sugg a{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;padding:0 12px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.sugg a .n{font-family:var(--mincho);font-size:16px}
.sugg a .p{font-size:13px;color:var(--mute);white-space:nowrap}
.sugg a:hover{background:var(--bg)}
main{padding:20px 0 8px}
.lv{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lbl{font-size:13px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.x{color:var(--mute)}
a.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;font-family:var(--mincho);font-size:16px;line-height:1.3}
span.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--mincho);font-size:16px;color:var(--mute)}
.s{font-family:system-ui,-apple-system,sans-serif;margin-right:4px}
.mom{border-color:var(--mom)!important}.mom>.s{color:var(--mom)}
.dad{border-color:var(--dad)!important}.dad>.s{color:var(--dad)}
.unk{border-color:var(--unk)!important;border-style:dashed!important}
.sel{border-color:var(--sel)!important;border-style:dotted!important;border-width:2px!important}
.box{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.box a.chip,.box span.chip{min-height:36px;font-size:14px;padding:2px 8px}
.alt{width:100%;border:2px dotted var(--alt);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:10px}
.alt .lbl{color:var(--alt)}
.alt a.chip,.alt span.chip,.alt .box{border-color:var(--alt);border-style:dotted;border-width:2px}
.src{font-size:13px;color:var(--mute)}
.say{color:var(--mute);font-size:15px}
.stem{width:1px;height:18px;background:var(--line);margin:6px auto}
.center h2{margin:0;font-family:var(--mincho);font-size:28px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.center .sub{font-size:13px;color:var(--mute)}
.center .born{font-size:15px}
.kids .more{min-height:40px;padding:4px 12px;border:none;background:none;color:var(--dad);font-size:15px;text-decoration:underline;cursor:pointer}
.card{margin:22px 0 0;padding:14px 0 0;border-top:1px solid var(--line);font-size:15px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px}
.card dt{font-size:13px;color:var(--mute);white-space:nowrap;padding-top:1px}
.card dd{margin:0}
.linkbtn{border:none;background:none;padding:0 0 0 4px;color:var(--dad);font-size:13px;text-decoration:underline;cursor:pointer}
footer{margin:28px 0 32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.7}
footer p{margin:0 0 6px}
footer a{color:var(--mute);word-break:break-all}
.mago{margin-left:6px;font-family:system-ui,-apple-system,sans-serif;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:1.4}
/* ---------- 見出しの行き来 ---------- */
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
nav.nav{display:flex;gap:14px;font-size:14px;white-space:nowrap}
nav.nav a{color:var(--dad);text-decoration:none;padding:6px 0}
nav.nav a.on{color:var(--ink)}
.famlink{margin:18px 0 0;text-align:center}
.famlink a{color:var(--dad);font-size:15px}
/* ---------- 地図 ---------- */
#mapv{padding:16px 0 8px}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mhead .mn{font-family:var(--mincho);font-size:22px;font-weight:600;letter-spacing:.04em}
.mhead .mb{font-size:13px;color:var(--mute)}
.mhead a{font-size:14px;color:var(--dad);margin-left:auto}
.mnote{font-size:13px;color:var(--mute);margin-top:2px}
#msvg{display:block;width:100%;height:auto;margin:8px 0 0}
#msvg .tile{stroke:var(--bg);stroke-width:1.5;cursor:pointer}
#msvg .tile.t0{fill:#EDE6D8}
#msvg .tile.t1{fill:var(--ink);fill-opacity:.15}
#msvg .tile.t2{fill:var(--ink);fill-opacity:.35}
#msvg .tile.t3{fill:var(--ink);fill-opacity:.6}
#msvg .tile.t4{fill:var(--ink);fill-opacity:.9}
#msvg .born{fill:none;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
#msvg text{font-size:19px;fill:var(--ink);pointer-events:none;dominant-baseline:central}
#msvg text.l3{font-size:15px}
#msvg text.k0{fill:var(--mute)}
#msvg text.w{fill:#fff}
#msvg text.pk{font-weight:700}
.mleg{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute);margin:4px 0 0}
.mleg svg{width:14px;height:16px}
.mleg span{margin-left:6px}
.mlist{margin:16px 0 0;border-top:1px solid var(--line);padding-top:10px}
.mlh{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--mute);margin-bottom:4px}
.mlh button{border:none;background:none;padding:6px 0;color:var(--dad);font-size:13px;text-decoration:underline;cursor:pointer}
.mlist ol{list-style:none;margin:0;padding:0}
.mlist a.mr{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.mlist a.mr.on{background:#EDE6D8}
.mr .rk{width:2em;text-align:right;font-size:13px;color:var(--mute)}
.mr .nm{font-family:var(--mincho);font-size:16px;flex:1}
.mr .tt{font-size:13px;color:var(--mute);white-space:nowrap}
.mlist .more{min-height:40px;padding:4px 0;border:none;background:none;color:var(--dad);font-size:15px;text-decoration:underline;cursor:pointer}
@media (max-width:480px){ #msvg{width:calc(100% + 32px);margin-left:-16px;margin-right:-16px} }
/* ---------- 一族・全体の木 ---------- */
#treev{padding:10px 0 0}
.thead{font-size:13px;color:var(--mute)}
.thead .tn{font-family:var(--mincho);font-size:18px;color:var(--ink);font-weight:600}
.leg{font-size:clamp(10.5px,3vw,12px);color:var(--mute);line-height:1.6}
.leg .m{color:var(--mom)}.leg .f{color:var(--dad)}.leg .u{color:var(--unk)}.leg .s2{color:var(--sel)}.leg .a{color:var(--alt)}
.leg i{font-style:normal;display:inline-block;width:10px;height:10px;border:1px solid var(--line);margin:0 2px 0 8px;vertical-align:-1px}
.tbox{position:relative;overflow:hidden;touch-action:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px;background:var(--bg);height:60vh;cursor:grab;-webkit-user-select:none;user-select:none}
.tbox svg{display:block;width:100%;height:100%}
.tbox .fit{position:absolute;right:10px;bottom:10px;min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--dad);font-size:14px;cursor:pointer}
.cap{font-size:13px;color:var(--mute);margin:6px auto 0}
.tr .ed{fill:none;stroke-width:1.3;opacity:.8}
.tr .e0{stroke:var(--mom)}.tr .e1{stroke:var(--dad)}
.tr .e2,.tr .e4{stroke:var(--unk);stroke-dasharray:5 4}
.tr .e3{stroke:var(--sel);stroke-dasharray:1.5 3;stroke-width:1.8}
.tr .e5{stroke:var(--alt);stroke-dasharray:1.5 3;stroke-width:1}
.tr g.n{cursor:pointer}
.tr g.n rect{fill:#fff;stroke:#B9B0A0;stroke-width:1}
.tr g.n.t0 rect{fill:var(--bg);stroke:none}
.tr g.n.t3 rect,.tr g.n.t4 rect{stroke:var(--ink);stroke-width:1.6}
.tr g.n text{font-family:var(--mincho);fill:var(--ink);dominant-baseline:central;text-anchor:middle}
.tr g.n.t0 text{fill:var(--mute);font-size:11px}
.tr g.n.t1 text{font-size:12px}.tr g.n.t2 text{font-size:14px}.tr g.n.t3 text{font-size:17px}.tr g.n.t4 text{font-size:22px;font-weight:700}
.tr g.n.on rect{fill:var(--ink);stroke:var(--ink)}
.tr g.n.on text{fill:#fff}
.tr circle.dot{fill:var(--mute)}
.tr circle.pt{fill:var(--mute);display:none}
.tr.z1 g.n.t0 > :not(.pt),.tr.z1 g.n.t1 > :not(.pt),.tr.z2 g.n.t2 > :not(.pt){display:none}
.tr.z1 g.n.t0 .pt,.tr.z1 g.n.t1 .pt,.tr.z2 g.n.t2 .pt{display:inline}
.tr:not(.wh).z1 g.n.on > *{display:inline!important}
/* 全体：線は細く薄く、箱と名前を主役に。1,000 t 以上の名前はいつも読める大きさ */
.tr.wh .ed{stroke-width:.8;opacity:.35;vector-effect:non-scaling-stroke}
.tr.wh .e3,.tr.wh .e5{stroke-width:1}
.tr .pt{transform-box:fill-box;transform-origin:center;transform:scale(var(--ik,1))}
.tr.wh.zb g.n.t3 rect,.tr.wh.zb g.n.t4 rect{display:none}
.tr.wh.zb g.n.t3 text,.tr.wh.zb g.n.t4 text{stroke:var(--bg);stroke-width:calc(3.5px * var(--ik,1));paint-order:stroke;stroke-linejoin:round}
.tr.wh.zb g.n.t3 text{font-size:calc(13px * var(--ik,1))}
.tr.wh.zb g.n.t4 text{font-size:calc(17px * var(--ik,1))}
.tr.wh.lit .ed{opacity:.07}
.tr.wh.lit .ed.hi{opacity:.95;stroke-width:1.6}
.tr.wh.lit g.n:not(.hl):not(.on){opacity:.25}
.tr.wh.lit circle.dot{opacity:.25}
.tr.wh.zb g.n.on > *{display:none}
.tr.wh.zb g.n.on > text{display:inline;fill:var(--ink);font-size:calc(15px * var(--ik,1));stroke:var(--bg);stroke-width:calc(4px * var(--ik,1));paint-order:stroke;stroke-linejoin:round;font-weight:700}
.tbox .go{position:absolute;left:10px;bottom:10px;min-height:36px;display:flex;align-items:center;padding:4px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;font-size:14px;text-decoration:none}
.tbox .go[hidden]{display:none}
.tr.wh.zb g.n.hid > text{display:none}
.tr.wh.zb g.n.hid > .pt{display:inline}
@media (max-width:600px){ .tr.wh.zb g.n.t3 text{font-size:calc(10.5px * var(--ik,1))} .tr.wh.zb g.n.t4 text{font-size:calc(13px * var(--ik,1))} }
/* 地方の色分け版：縮めた時の点も地方の色に */
.tr g.n.r0 .pt{fill:#7FA3BE}.tr g.n.r1 .pt{fill:#8DAE78}.tr g.n.r2 .pt{fill:#C2A06A}.tr g.n.r3 .pt{fill:#A08BBE}
.tr g.n.r4 .pt{fill:#C98872}.tr g.n.r5 .pt{fill:#6FAE9E}.tr g.n.r6 .pt{fill:#C4AE5A}.tr g.n.r7 .pt{fill:#B87E9C}
.tbox .go span{font-family:var(--mincho);font-size:15px}
.tr:not(.wh).z1 g.n.on .pt{display:none!important}
.tr g.n.r0 rect{fill:#D6E4EE}.tr g.n.r1 rect{fill:#DCE8D3}.tr g.n.r2 rect{fill:#EDE0C8}.tr g.n.r3 rect{fill:#E2D9EC}
.tr g.n.r4 rect{fill:#F2D9D0}.tr g.n.r5 rect{fill:#D3E8E2}.tr g.n.r6 rect{fill:#F0E6C0}.tr g.n.r7 rect{fill:#EBD3DF}
.leg i.r0{background:#D6E4EE}.leg i.r1{background:#DCE8D3}.leg i.r2{background:#EDE0C8}.leg i.r3{background:#E2D9EC}
.leg i.r4{background:#F2D9D0}.leg i.r5{background:#D3E8E2}.leg i.r6{background:#F0E6C0}.leg i.r7{background:#EBD3DF}
.tr g.n.on rect{fill:var(--ink);stroke:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="hrow"><h1>酒米の系図</h1><nav class="nav" id="nav" aria-label="画面"><a data-v="g" href="#">系図</a><a data-v="m" href="#">地図</a><a data-v="t" href="#">全体</a></nav></div>
    <p>酒米ハンドブックをもとに、親と子をたどれます</p>
  </header>
  <div class="search">
    <div style="position:relative">
      <input id="q" type="search" placeholder="品種名・県名で探す" autocomplete="off" enterkeyhint="search" aria-label="品種名・県名で探す">
      <ul class="sugg" id="sugg" hidden></ul>
    </div>
  </div>
  <main id="view"></main>
  <section id="mapv" hidden></section>
</div>
<section id="treev" hidden></section>
<div class="wrap">
  <footer>
    <p>主な出典：副島顕子『酒米ハンドブック 改訂版』文一総合出版、2017（品種ごとに頁を表示。系譜図・本文は転載していません）</p>
    <p>数量：「米穀の農産物検査結果」4 銘柄別検査数量（3）醸造用玄米（令和7年産速報値・令和8年3月31日現在）（農林水産省）を加工して作成 <a href="https://www.maff.go.jp/j/seisan/syoryu/kensa/kome/" rel="noopener">https://www.maff.go.jp/j/seisan/syoryu/kensa/kome/</a>（2026年10月27日利用）</p>
    <p>親の情報は農研機構イネ品種データベースと各県の試験場の報告などで照合しました</p>
  </footer>
</div>

const V = new Map(D.varieties.map(v => [v.name, v]));
const N = new Map(D.nodes.map(n => [n.name, n]));

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function href(name){ return "#" + encodeURIComponent(name); }
function isCenterable(name){ return V.has(name) || (N.has(name) && N.get(name).kind === "name"); }
function isInter(name){ return N.has(name) && N.get(name).kind === "inter"; }
function firstYear(v){ return v && v.year ? v.year : null; }

/* ---------- かっこの深さを数えて切る ---------- */
const OPEN = "（(", CLOSE = "）)";
function splitTop(s, sep){
  const out = []; let d = 0, cur = "";
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(OPEN.includes(c)) d++;
    else if(CLOSE.includes(c)) d = Math.max(0, d - 1);
    if(d === 0 && s.startsWith(sep, i)){ out.push(cur); cur = ""; i += sep.length - 1; continue; }
    cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(x => x);
}
// 末尾の（…）を1つ外す → [残り, 中身] / null
function peelLast(s){
  s = s.trim();
  if(!(s.endsWith("）") || s.endsWith(")"))) return null;
  let d = 0;
  for(let i = s.length - 1; i >= 0; i--){
    const c = s[i];
    if(CLOSE.includes(c)) d++;
    else if(OPEN.includes(c)){ d--; if(d === 0) return [s.slice(0, i).trim(), s.slice(i + 1, -1)]; }
  }
  return null;
}

/* ---------- 親の式：♀A × ♂B ／ A / B（向き不明） ／ X（選抜・変異の元） ---------- */
function stripSym(s){ return s.trim().replace(/^[♀♂]\s*/, "").trim(); }
function unwrap(s){
  if(s.startsWith("(") || s.startsWith("（")){
    const p = peelLast(s);
    if(p && p[0] === "") return p[1];
  }
  return null;
}
function parseExpr(s){
  s = s.trim();
  const p = peelLast(s);
  if(p && p[1] === "向き不明") return {t:"unk", xs: splitTop(p[0], "/").map(parseTerm)};
  if(p && p[1] === "選抜・変異の元") return {t:"sel", x: parseTerm(p[0])};
  const xs = splitTop(s, "×");
  if(xs.length === 2) return {t:"pair", m: parseTerm(xs[0]), f: parseTerm(xs[1])};
  return {t:"names", xs: splitTop(s, "・").map(n => ({t:"name", name: n}))};
}
function parseTerm(s){
  const b = stripSym(s), inner = unwrap(b);
  return inner !== null ? parseExpr(inner) : {t:"name", name: b};
}
function canon(e){
  if(!e) return "";
  switch(e.t){
    case "name": return isInter(e.name) ? canon(nodeExpr(N.get(e.name))) : e.name;
    case "pair": return "[♀" + canon(e.m) + "×♂" + canon(e.f) + "]";
    case "unk": return "{" + e.xs.map(canon).sort().join("/") + "}";
    case "sel": return "元:" + canon(e.x);
    case "names": return e.xs.map(canon).join("・");
  }
  return "";
}
// データの親（alt を除く）から式を作る
function nodeExpr(item){
  const ps = (item.parents || []).filter(p => p.role !== "alt");
  const mom = ps.find(p => p.role === "母"), dad = ps.find(p => p.role === "父");
  if(mom && dad) return {t:"pair", m:{t:"name", name: mom.name}, f:{t:"name", name: dad.name}};
  const unk = ps.filter(p => p.role === "不明");
  if(unk.length >= 2) return {t:"unk", xs: unk.map(p => ({t:"name", name: p.name}))};
  const sel = ps.find(p => p.role === "元");
  if(sel) return {t:"sel", x:{t:"name", name: sel.name}};
  return null;
}

/* ---------- 食い違い：どちらにも決めず並べる（式と資料名は生成側で作ってある） ---------- */
const GROUP = {book: "本の別の頁では", other: "別の資料では"};
function altGroups(v){
  const alts = (v.parents || []).filter(p => p.role === "alt");
  if(!v.conf && !alts.length) return [];
  const mainC = canon(nodeExpr(v));
  const mainNames = new Set((v.parents || []).filter(p => p.role !== "alt").map(p => p.name));
  const out = {book: [], other: []}, seen = new Map();   // 同じ親の組は1つにまとめ、資料を並べる
  const addExpr = (g, e, src) => {
    const c = canon(e);
    if(!c || c === mainC) return;
    const o = seen.get(g + c);
    if(o){ if(!o.srcs.includes(src)) o.srcs.push(src); return; }
    const n = {e, srcs:[src]}; seen.set(g + c, n); out[g].push(n);
  };
  for(const it of (v.conf || [])){
    if(it.names){
      const ns = splitTop(it.e, "・").filter(n => !mainNames.has(n));
      if(ns.length) addExpr(it.g, {t:"names", xs: ns.map(n => ({t:"name", name: n}))}, it.src);
    } else addExpr(it.g, parseExpr(it.e), it.src);
  }
  // 文から拾えなかった別の親も落とさない
  const shown = new Set();
  const walk = e => { if(!e) return; if(e.t === "name") shown.add(e.name); (e.xs || []).forEach(walk); walk(e.m); walk(e.f); walk(e.x); };
  out.book.concat(out.other).forEach(o => walk(o.e));
  const rest = alts.map(p => p.name).filter(n => !shown.has(n));
  if(rest.length) out.other.push({e:{t:"names", xs: rest.map(n => ({t:"name", name: n}))}, srcs: ["ほかの資料による"]});
  return ["book", "other"].filter(g => out[g].length).map(g => ({head: GROUP[g], list: out[g]}));
}

/* ---------- 描く ---------- */
function symHTML(sym){ return sym ? '<span class="s">' + sym + '</span>' : ""; }
function chip(name, cls, sym, mark){
  if(isInter(name)) return interBox(name, cls, sym);
  const mk = mark ? '<small class="mago">' + mark + '</small>' : "";
  if(isCenterable(name)) return '<a class="chip ' + (cls || "") + '" href="' + href(name) + '">' + symHTML(sym) + esc(name) + mk + '</a>';
  return '<span class="chip ' + (cls || "") + '">' + symHTML(sym) + esc(name) + '</span>';
}
// 名前のない中間：箱の中に ♀A × ♂B を小さく（箱は中心にならない）
function interBox(name, cls, sym){
  const e = nodeExpr(N.get(name));
  return '<span class="box ' + (cls || "") + '">' + symHTML(sym) + (e ? exprInner(e) : esc(name)) + '</span>';
}
function termHTML(t, cls, sym){
  if(t.t === "name") return chip(t.name, cls, sym);
  return '<span class="box ' + (cls || "") + '">' + symHTML(sym) + exprInner(t) + '</span>';
}
function exprInner(e){
  switch(e.t){
    case "pair": return termHTML(e.m, "mom", "♀") + '<span class="x">×</span>' + termHTML(e.f, "dad", "♂");
    case "unk": return e.xs.map(x => termHTML(x, "unk")).join('<span class="x">/</span>');
    case "sel": return termHTML(e.x, "sel");
    case "names": return e.xs.map(x => termHTML(x, "")).join("");
  }
  return "";
}
function exprLine(e){
  let lbl = "";
  if(e.t === "unk") lbl = '<div class="lbl">親（どちらが母かは不明）</div>';
  if(e.t === "sel") lbl = '<div class="lbl">選び出した元</div>';
  if(e.t === "names" && e.xs.length === 1) return '<div class="row"><span class="lbl">片親：</span>' + exprInner(e) + '</div>';
  return lbl + '<div class="row">' + exprInner(e) + '</div>';
}
function parentsHTML(item){
  const v = V.get(item.name);
  const ps = (item.parents || []).filter(p => p.role !== "alt");
  let h = "";
  if(v && v.root && !ps.length){
    h += '<div class="say">' + esc(v.root) + '</div>';
  } else {
    const e = nodeExpr(item), sys = ps.filter(p => p.role === "系");
    if(e) h += exprLine(e);
    else if(sys.length) h += '<div class="lbl">元になった品種</div><div class="row">' + sys.map(p => chip(p.name, "unk")).join("") + '</div>';
    else if(ps.length) h += '<div class="row">' + ps.map(p => chip(p.name, "")).join("") + '</div>';
    else h += '<div class="say">親は分かっていない</div>';
  }
  for(const g of (v ? altGroups(v) : [])){
    h += '<div class="alt"><div class="lbl">' + g.head + '</div>' +
      g.list.map(a => '<div>' + exprLine(a.e) + a.srcs.map(x => '<div class="src">' + esc(x) + '</div>').join("") + '</div>').join("") + '</div>';
  }
  return '<section class="lv parents">' + h + '</section>';
}
// 子：名前のない中間を飛ばして、その先の名前のある品種を出す（中間を挟んだ先は孫の印を付ける）
function namedChildren(list){
  const direct = [], deep = [], seen = new Set();
  const walk = (xs, d) => {
    for(const c of xs){
      if(isInter(c)){ if(!seen.has(c)){ seen.add(c); walk(N.get(c).children || [], true); } }
      else (d ? deep : direct).push(c);
    }
  };
  walk(list, false);
  return {all: [...new Set(direct.concat(deep))], grand: new Set(deep.filter(c => !direct.includes(c)))};
}
function byYear(a, b){
  const ya = firstYear(V.get(a)), yb = firstYear(V.get(b));
  if(ya !== yb){ if(ya === null) return 1; if(yb === null) return -1; return ya < yb ? -1 : 1; }
  return a.localeCompare(b, "ja");
}
const KIDS_MAX = 12;
function childrenHTML(item, showAll){
  const nk = namedChildren(item.children || []), grand = nk.grand;
  const kids = nk.all.sort(byYear);
  const altKids = namedChildren(item.children_alt || []).all.filter(k => !kids.includes(k)).sort(byYear);
  if(!kids.length && !altKids.length) return "";
  let h = "";
  if(kids.length){
    const vis = showAll ? kids : kids.slice(0, KIDS_MAX);
    h += '<div class="lbl">子</div><div class="row">' + vis.map(k => chip(k, "", "", grand.has(k) ? "孫" : "")).join("") + '</div>';
    if(!showAll && kids.length > KIDS_MAX) h += '<button class="more" id="moreKids" type="button">… ほか' + (kids.length - KIDS_MAX) + '品種</button>';
  }
  if(altKids.length){
    h += '<div class="alt"><div class="lbl">別の資料では、この品種の子</div><div class="row">' + altKids.map(k => chip(k, "")).join("") + '</div></div>';
  }
  return '<div class="stem"></div><section class="lv kids">' + h + '</section>';
}
function bornHTML(v){
  const y = firstYear(v), pref = v.pref || "";
  const line = [pref, y ? y + "年" : ""].filter(Boolean).join("・");
  return (line ? '<div class="born">' + esc(line) + '</div>' : "") + (v.breeder ? '<div class="sub">' + esc(v.breeder) + '</div>' : "");
}
function sourceHTML(v, showPages){
  const ls = v.src || [];
  let h = "";
  ls.forEach((x, i) => {
    h += '<div>' + esc(x);
    if(i === 0 && v.pages) h += showPages ? '<div>' + v.pages.map(p => "p." + p).join("・") + '</div>' : ' <button class="linkbtn" id="morePages" type="button">ほか</button>';
    h += '</div>';
  });
  return h;
}
function cardHTML(v, st){
  const rows = [];
  const cult = Object.entries(v.cult || {}).sort((a, b) => b[1] - a[1]);
  let c;
  if(!cult.length) c = "令和7年産の記録なし";
  else {
    c = esc(cult.slice(0, 5).map(x => x[0]).join("・")) + (cult.length > 5 ? "…ほか" + (cult.length - 5) + "県" : "");
    c += '<div>全国 ' + (v.cult_total >= 1 ? v.cult_total.toLocaleString("ja-JP") + " t" : "1 t未満") + '（令和7年産）</div>';
  }
  rows.push(["作っている県", c]);
  if(v.cat) rows.push(["区分", esc(v.cat)]);
  if(v.year_note) rows.push(["年について", esc(v.year_note)]);
  rows.push(["出典", '<div class="src">' + sourceHTML(v, st.pages) + '</div>']);
  return '<section class="card"><dl>' + rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join("") + '</dl></section>';
}

let cur = null, st = {kids:false, pages:false};
function render(){
  const v = V.get(cur), item = v || N.get(cur);
  let h = parentsHTML(item) + '<div class="stem"></div><section class="lv center"><h2>' + esc(cur) + '</h2>';
  if(v){
    if(!v.inbook) h += '<div class="sub">本に載っていない品種</div>';
    if(v.aliases && v.aliases.length) h += '<div class="sub">別名 ' + esc(v.aliases.join("／")) + '</div>';
    h += bornHTML(v);
  }
  h += '</section>' + childrenHTML(item, st.kids);
  if(hasFamily(cur)) h += '<div class="famlink"><a href="#' + encodeURIComponent("一族/" + cur) + '">一族を1枚で見る</a></div>';
  if(v) h += cardHTML(v, st);
  document.getElementById("view").innerHTML = h;
  const mk = document.getElementById("moreKids");
  if(mk) mk.onclick = () => { st.kids = true; render(); };
  const mp = document.getElementById("morePages");
  if(mp) mp.onclick = () => { st.pages = true; render(); };
}
function fromHash(){
  let name = "";
  try { name = decodeURIComponent(location.hash.slice(1)); } catch(e) { name = ""; }
  if(!isCenterable(name)){
    if(location.hash) history.replaceState(null, "", location.pathname + location.search + href(HOME));
    name = HOME;
  }
  show("g");
  cur = name;
  if(name !== gShown){ gShown = name; st = {kids:false, pages:false}; render(); window.scrollTo(0, 0); }
  navUpdate("g");
}
// # の形：#品種名（系図）／#地図/品種名／#一族/品種名／#全体/品種名
function route(){
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch(e) { h = ""; }
  const rep = s => history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(s));
  if(h === "地図" || h.startsWith("地図/")){ const n = h.slice(3); return showMap(isCenterable(n) ? n : null); }
  if(h === "全体" || h.startsWith("全体/")){ const n = h.slice(3); if(n && !isCenterable(n)) rep("全体"); return showAll(isCenterable(n) ? n : null); }
  if(h.startsWith("一族/")){ const n = h.slice(3); if(isCenterable(n) && hasFamily(n)) return showFam(n); rep(isCenterable(n) ? n : HOME); return route(); }
  fromHash();
}
window.addEventListener("hashchange", route);

/* ---------- 探す ---------- */
function norm(s){
  return String(s).normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, "");
}
const POOL = D.varieties.map(v => ({name: v.name, pref: v.pref || "", total: v.cult_total || 0, key: norm(v.name)}))
  .concat(D.nodes.filter(n => n.kind === "name").map(n => ({name: n.name, pref: "", total: 0, key: norm(n.name)})));
const PREFS = new Set();
D.varieties.forEach(v => { if(v.pref) PREFS.add(v.pref); Object.keys(v.cult || {}).forEach(p => PREFS.add(p)); });
const byAmount = (a, b) => (b.total - a.total) || (a.name.length - b.name.length) || a.name.localeCompare(b.name, "ja");

const qEl = document.getElementById("q"), sEl = document.getElementById("sugg");
let firstHit = null;
function li(o){ return '<li><a href="' + href(o.name) + '"><span class="n">' + esc(o.name) + '</span><span class="p">' + esc(o.pref) + '</span></a></li>'; }
function suggest(){
  const raw = qEl.value.trim(), q = norm(raw);
  let h = "", first = null;
  if(!q){
    const top = POOL.filter(o => o.total > 0).sort(byAmount).slice(0, 10);
    h = '<li class="h">よく作られている品種</li>' + top.map(li).join("");
    first = top[0] || null;
  } else {
    let pref = null;
    if(PREFS.has(raw)) pref = raw;
    else { const s = raw.replace(/[県府都]$/, ""); if(PREFS.has(s)) pref = s; }
    const hits = POOL.filter(o => o.key.includes(q)).sort(byAmount);
    if(pref){
      const grown = D.varieties.filter(v => v.cult && pref in v.cult)
        .sort((a, b) => (b.cult[pref] - a.cult[pref]) || a.name.localeCompare(b.name, "ja")).slice(0, 20)
        .map(v => ({name: v.name, pref: v.pref || ""}));
      if(grown.length) h += '<li class="h">' + esc(pref) + 'で作っている品種</li>' + grown.map(li).join("");
      const inGrown = new Set(grown.map(o => o.name));
      const rest = hits.filter(o => !inGrown.has(o.name));
      if(rest.length) h += '<li class="h">名前に「' + esc(raw) + '」を含む品種</li>' + rest.slice(0, 8).map(li).join("");
      first = grown[0] || hits[0] || null;
      if(!h) h = '<li class="none">見つかりません</li>';
    } else {
      const top = hits.slice(0, 8);
      h = top.length ? top.map(li).join("") : '<li class="none">見つかりません</li>';
      first = top[0] || null;
    }
  }
  firstHit = first;
  sEl.innerHTML = h;
  sEl.hidden = false;
}
function closeSugg(){ sEl.hidden = true; }
function go(name){ closeSugg(); qEl.value = ""; qEl.blur(); if(mode !== "g" || name !== gShown) location.hash = encodeURIComponent(name); }
qEl.addEventListener("focus", suggest);
qEl.addEventListener("input", suggest);
qEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); if(firstHit) go(firstHit.name); }
  else if(e.key === "Escape"){ closeSugg(); qEl.blur(); }
});
qEl.addEventListener("blur", () => setTimeout(closeSugg, 150));
sEl.addEventListener("mousedown", e => e.preventDefault());
sEl.addEventListener("click", e => {
  const a = e.target.closest("a"); if(!a) return;
  e.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});

    h = '<div class="mlh"><span>全国でよく作られている品種</span></div><ol>' + vis.map((o, i) => row(o, i + 1, amountText(o.cult_total))).join("") + '</ol>' +
      (!mAll && RANK.length > RANK_MAX ? '<button class="more" type="button" data-k="more">… ほか' + (RANK.length - RANK_MAX) + '品種</button>' : "");
  }
  document.getElementById("mlist").innerHTML = h;
}
function showMap(name){
  show("m");
  if(!mapBuilt) buildMap();
  if(!name){ name = RANK[0].name; history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent("地図/" + name)); }
  mSel = name; cur = name; mAll = false;
  drawMap(); navUpdate("m");
}

/* ---------- 一族・全体：線と箱を描く（座標は生成時に計算済み） ---------- */
const ROLECLS = ["e0", "e1", "e2", "e3", "e4", "e5"];
function nodeTitle(name){
  const v = V.get(name); if(!v) return name;
  const y = firstYear(v);
  return name + (v.pref || y ? "（" + [v.pref, y ? y + "年" : ""].filter(Boolean).join("・") + "）" : "");
}
function treeSVG(pos, edges, onIdx, cols){
  // pos: Map(i -> [x, y])。cols があれば edges の4つ目以降は仮の点の y（段ごと）
  let eh = "", nh = "";
  const f = n => n.toFixed(1);
  const anchor = (i, side) => {
    const [x, y] = pos.get(i), [w, h, t] = LAY.size[i];
    return t < 0 ? [x + w / 2, y + h / 2] : [side > 0 ? x + w : x, y + h / 2];
  };
  edges.forEach((e, k) => {
    const [a, b, r] = e, via = e.slice(3);
    let [x1, y1] = anchor(a, 1);
    const [x2, y2] = anchor(b, -1);
    let d = "M" + f(x1) + " " + f(y1);
    const curve = (xa, ya, xb, yb) => { const dx = Math.max(20, (xb - xa) * 0.5); return "C" + f(xa + dx) + " " + f(ya) + " " + f(xb - dx) + " " + f(yb) + " " + f(xb) + " " + f(yb); };
    if(cols && via.length){
      const l0 = pos.get(a)[2];
      via.forEach((vy, n) => { const [cx, cw] = cols[l0 + 1 + n]; d += curve(x1, y1, cx, vy) + "L" + f(cx + cw) + " " + f(vy); x1 = cx + cw; y1 = vy; });
    }
    d += curve(x1, y1, x2, y2);
    eh += '<path class="ed ' + ROLECLS[r] + '" data-k="' + k + '" d="' + d + '"/>';
  });
  for(const [i, [x, y]] of pos){
    const [w, h, t] = LAY.size[i], name = NAMES[i];
    if(t < 0){ nh += '<circle class="dot" cx="' + (x + w / 2) + '" cy="' + (y + h / 2) + '" r="3.5"/>'; continue; }
    const rg = LAY.tint && LAY.tint[i] >= 0 ? " r" + LAY.tint[i] : "";
    nh += '<g class="n t' + t + rg + (i === onIdx ? " on" : "") + '" data-i="' + i + '" transform="translate(' + x + "," + y + ')">' +
      '<title>' + esc(nodeTitle(name)) + '</title><rect width="' + w + '" height="' + h + '" rx="3"/>' +
      '<text x="' + (w / 2) + '" y="' + (h / 2) + '">' + esc(name) + '</text><circle class="pt" cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="' + [1.6, 2.2, 3, 3.5, 4][t] + '"/></g>';
  }
  return '<g class="vp"><g>' + eh + '</g><g>' + nh + '</g></g>';
}
function bbox(pos){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(const [i, [x, y]] of pos){ const [w, h] = LAY.size[i]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
  return {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
}
// 拡大と移動（ライブラリなし）：指1本／ドラッグで移動、2本／ホイールで拡大縮小。動きが小さい時だけ「押した」
function PanZoom(box, svg){
  const s = {k: 1, x: 0, y: 0, bb: null};
  const vp = () => svg.querySelector("g.vp");
  const apply = () => {
    const g = vp(); if(g) g.setAttribute("transform", "translate(" + s.x.toFixed(1) + "," + s.y.toFixed(1) + ") scale(" + s.k.toFixed(4) + ")");
    svg.classList.toggle("z1", s.k < 0.5); svg.classList.toggle("z2", s.k < 0.35); svg.classList.toggle("zb", s.k < 0.7);
    svg.style.setProperty("--ik", (1 / s.k).toFixed(4));
    if(s.onApply) s.onApply();
  };
  const size = () => [box.clientWidth, box.clientHeight];
  s.fit = cap => { const [W, H] = size(), b = s.bb, p = s.pad || 0; s.k = Math.min(cap || 4, Math.min((W - 2 * p) / b.w, H / b.h) * 0.94); s.x = (W - b.w * s.k) / 2 - b.x * s.k; s.y = (H - b.h * s.k) / 2 - b.y * s.k; apply(); };
  s.fitK = () => { const [W, H] = size(), b = s.bb; return Math.min(W / b.w, H / b.h) * 0.94; };
  s.focus = (cx, cy, k) => { const [W, H] = size(); s.k = k; s.x = W / 2 - cx * k; s.y = H / 2 - cy * k; apply(); };
  const zoomAt = (px, py, f) => { const k = Math.min(4, Math.max(0.05, s.k * f)); f = k / s.k; s.x = px - (px - s.x) * f; s.y = py - (py - s.y) * f; s.k = k; apply(); };
  const pts = new Map(); let downT = null, moved = 0, multi = false, last = null;
  const rel = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  box.addEventListener("pointerdown", e => {
    if(e.target.closest("button, a")) return;
    pts.set(e.pointerId, rel(e));
    if(pts.size === 1){ downT = e.target; moved = 0; multi = false; } else multi = true;
    last = null;
    try { box.setPointerCapture(e.pointerId); } catch(_) {}
  });
  box.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const p = rel(e), o = pts.get(e.pointerId);
    if(pts.size === 1){ s.x += p[0] - o[0]; s.y += p[1] - o[1]; moved += Math.abs(p[0] - o[0]) + Math.abs(p[1] - o[1]); pts.set(e.pointerId, p); apply(); return; }
    pts.set(e.pointerId, p);
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if(last){ s.x += m[0] - last.m[0]; s.y += m[1] - last.m[1]; zoomAt(m[0], m[1], d / last.d); }
    last = {d, m}; moved += 100;
  });
  const up = e => {
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); last = null;
    if(pts.size === 0 && !multi && moved < 8 && downT){
      const g = downT.closest && downT.closest("g.n");
      if(s.onTap) s.onTap(g ? +g.dataset.i : -1);
    }
    if(pts.size === 0) downT = null;
  };
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", e => { pts.delete(e.pointerId); last = null; multi = true; });
  box.addEventListener("wheel", e => { e.preventDefault(); const p = rel(e); zoomAt(p[0], p[1], Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015))); }, {passive: false});
  // 枠の大きさが変わったら、見ていた中心を保つ
  let lw = 0, lh = 0;
  s.mark = () => { [lw, lh] = size(); };
  s.resize = () => { const [W, H] = size(); if(lw){ s.x += (W - lw) / 2; s.y += (H - lh) / 2; apply(); } lw = W; lh = H; };
  s.apply = apply;
  return s;
}
let tree = null;   // {kind, key, pz, pos}
function treeShell(){
  const v = document.getElementById("treev");
  if(v.dataset.ok) return;
  v.innerHTML = '<div class="wrap"><div class="thead" id="thead"></div><div class="leg" id="tleg"></div></div>' +
    '<div class="tbox" id="tbox"><svg id="tsvg" class="tr" aria-label="系図の図"></svg><a class="go" id="tgo" hidden></a><button class="fit" id="tfit" type="button">全体を見る</button></div>' +
    '<p class="cap wrap" id="tcap"></p>';
  v.dataset.ok = "1";
  const box = document.getElementById("tbox"), svg = document.getElementById("tsvg");
  tree = {pz: PanZoom(box, svg), key: null};
  document.getElementById("tfit").onclick = () => tree.pz.fit();
  tree.pz.onApply = declutter;
  tree.pz.onTap = i => {
    const n = i >= 0 ? NAMES[i] : null;
    if(tree.kind !== "W"){ if(n && isCenterable(n)) location.hash = encodeURIComponent(n); return; }
    if(i < 0){ wSelect(-1); return; }
    if(i === tree.sel && isCenterable(n)){ location.hash = encodeURIComponent(n); return; }
    wSelect(i);
  };
  window.addEventListener("resize", () => { if(mode === "t"){ sizeBox(); tree.pz.resize(); } });
}
function sizeBox(){
  const box = document.getElementById("tbox"), cap = document.getElementById("tcap");
  const top = box.getBoundingClientRect().top + window.scrollY;
  box.style.height = Math.max(320, window.innerHeight - top - cap.offsetHeight - 14) + "px";
}
const LEGEND = '<span class="m">朱</span>＝母　<span class="f">藍</span>＝父<br><span class="u">灰破線</span>＝母か父か不明　<span class="s2">緑点線</span>＝選び出した元　<span class="a">柿点線</span>＝別の資料';
function legendTint(){
  return LAY.tint ? '<br>箱の地の色＝育成した地方' + LAY.regions.map((r, k) => '<i class="r' + k + '"></i>' + esc(r)).join("") : "";
}
function drawTree(key, pos, edges, onIdx, head, cap, cols){
  treeShell();
  show("t");
  document.getElementById("thead").innerHTML = head;
  document.getElementById("tleg").innerHTML = LEGEND + legendTint();
  document.getElementById("tcap").textContent = cap;
  sizeBox();
  const svg = document.getElementById("tsvg");
  tree.kind = key === "W" ? "W" : "F";
  tree.pz.pad = tree.kind === "W" ? 28 : 0;   // 縮めた時の大きな名前が左右の端で欠けない余白（画面の px）
  svg.classList.toggle("wh", tree.kind === "W");
  document.getElementById("tgo").hidden = true;
  if(tree.key !== key){ svg.innerHTML = treeSVG(pos, edges, onIdx, cols); tree.key = key; tree.pos = pos; tree.sel = -1; svg.classList.remove("lit"); }
  else {
    for(const g of svg.querySelectorAll("g.n.on")) g.classList.remove("on");
    const g = onIdx >= 0 && svg.querySelector('g.n[data-i="' + onIdx + '"]'); if(g) g.classList.add("on");
  }
  tree.pz.bb = bbox(pos);
  tree.pz.mark();
  return tree.pz;
}
let WPOS = null, WPAR = null, WKID = null;
function showAll(name){
  if(!WPOS){
    WPOS = new Map(LAY.W.map(([i, x, y, l]) => [i, [x, y, l]]));
    WPAR = new Map(); WKID = new Map();
    LAY.WE.forEach(([a, b, r], k) => { if(r === 5) return;
      if(!WPAR.has(b)) WPAR.set(b, []); WPAR.get(b).push(a);
      if(!WKID.has(a)) WKID.set(a, []); WKID.get(a).push(b); });
  }
  const i = name ? NIDX.get(name) : -1, inTree = i >= 0 && WPOS.has(i);
  if(name) cur = name;
  const pz = drawTree("W", WPOS, LAY.WE, -1, "", LAY.wcount + "品種が、ひとつの木でつながっています", LAY.WC);
  const box = document.getElementById("tbox");
  if(box.clientWidth < 600){ const b = pz.bb, k = box.clientHeight / b.h * 0.94; const [x, y] = inTree ? WPOS.get(i) : [b.x + b.w / 2, 0]; pz.focus(Math.min(Math.max(x, b.x + box.clientWidth / 2 / k), b.x + b.w - box.clientWidth / 2 / k), b.y + b.h / 2, k); }
  else pz.fit();
  wSelect(inTree ? i : -1, true);
  navUpdate("t");
}
// 大きな名前（1,000 t 以上）が重なったら、量の少ない方を隠す（拡大して離れれば出る）
function declutter(){
  const svg = document.getElementById("tsvg"), pz = tree.pz;
  if(tree.kind !== "W") return;
  const gs = [...svg.querySelectorAll("g.n.t3, g.n.t4, g.n.on")];
  gs.forEach(g => g.classList.remove("hid"));
  if(pz.k >= 0.7) return;
  const m = window.innerWidth <= 600, placed = [];
  const amt = g => { const v = V.get(NAMES[+g.dataset.i]); return v ? v.cult_total : 0; };
  gs.sort((a, b) => (b.classList.contains("on") - a.classList.contains("on")) || (amt(b) - amt(a)));
  for(const g of gs){
    const i = +g.dataset.i, [x, y] = WPOS.get(i), [w, h, t] = LAY.size[i], name = NAMES[i];
    const fs = g.classList.contains("on") ? 15 : t === 4 ? (m ? 13 : 17) : (m ? 10.5 : 13);
    let tw = 0; for(const c of name) tw += c.charCodeAt(0) < 0x2000 ? 0.62 * fs : fs;
    const cx = pz.x + (x + w / 2) * pz.k, cy = pz.y + (y + h / 2) * pz.k;
    const r = {l: cx - tw / 2 - 3, r: cx + tw / 2 + 3, t: cy - fs * 0.65, b: cy + fs * 0.65};
    if(placed.some(o => r.l < o.r && o.l < r.r && r.t < o.b && o.t < r.b)) g.classList.add("hid");
    else placed.push(r);
  }
}
function reach(c, m){
  const out = new Set(), st = [c];
  while(st.length){ const x = st.pop(); for(const y of (m.get(x) || [])) if(!out.has(y)){ out.add(y); st.push(y); } }
  return out;
}
function wSelect(i, quiet){
  const svg = document.getElementById("tsvg"), go = document.getElementById("tgo");
  for(const e of svg.querySelectorAll(".hi,.hl,.on")) e.classList.remove("hi", "hl", "on");
  tree.sel = i;
  svg.classList.toggle("lit", i >= 0);
  if(i < 0){ go.hidden = true; declutter(); return; }
  const anc = reach(i, WPAR), des = reach(i, WKID);
  for(const g of svg.querySelectorAll("g.n")){
    const j = +g.dataset.i;
    if(j === i) g.classList.add("on"); else if(anc.has(j) || des.has(j)) g.classList.add("hl");
  }
  for(const c of svg.querySelectorAll("circle.dot")){ /* 名前のない中間は線で分かるので触らない */ }
  for(const p of svg.querySelectorAll("path.ed")){
    const [a, b, r] = LAY.WE[+p.dataset.k];
    if(r !== 5 && ((anc.has(a) && (anc.has(b) || b === i)) || ((a === i || des.has(a)) && des.has(b)))) p.classList.add("hi");
  }
  const n = NAMES[i];
  cur = n;
  if(!quiet) history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent("全体/" + n));
  go.innerHTML = '<span>' + esc(n) + '</span>　系図へ →';
  go.setAttribute("href", href(n));
  go.hidden = !isCenterable(n);
  declutter();
  navUpdate("t");
}
const FAM = new Map(Object.entries(LAY.F).map(([k, v]) => [+k, v]));
function famPos(c){
  const [xs, s] = FAM.get(c), pos = new Map();
  for(let k = 0; k < s.length; k += 6){
    pos.set(parseInt(s.slice(k, k + 2), 36), [xs[parseInt(s[k + 2], 36)], parseInt(s.slice(k + 3, k + 6), 36) - 23328]);
  }
  return pos;
}
function hasFamily(name){ return FAM.has(NIDX.get(name)); }
function showFam(name){
  const c = NIDX.get(name), pos = famPos(c);
  cur = name;
  const edges = LAY.E.filter(([a, b, r]) => pos.has(a) && pos.has(b) && (r !== 5 || a === c || b === c));
  const pz = drawTree("F" + c, pos, edges, c, '<span class="tn">' + esc(name) + '</span> の祖先と子孫　<a href="' + href(name) + '" style="color:var(--dad)">系図 →</a>', "");
  const fk = pz.fitK();
  if(fk >= 0.6) pz.fit(1);
  else { const [x, y] = pos.get(c), [w, h] = LAY.size[c]; pz.focus(x + w / 2, y + h / 2, 0.8); }
  navUpdate("");
}

route();
