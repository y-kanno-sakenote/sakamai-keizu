<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒米の系図</title>
<style>
:root{
  --bg:#F7F3EA; --ink:#2A2724; --mute:#8C857B; --line:#DDD5C6;
  --mom:#B8432F; --dad:#2F4C7A; --unk:#8C857B; --sel:#5E7A45; --alt:#C27A2C;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{padding:14px 0 4px}
header.top h1{margin:0;font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.08em}
header.top p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.search input{width:100%;height:44px;padding:0 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.search input:focus{outline:2px solid var(--dad);outline-offset:-1px}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-top:none;max-height:70vh;overflow-y:auto;margin:0;padding:0;list-style:none}
.sugg[hidden]{display:none}
.sugg li.h{padding:8px 12px 4px;font-size:13px;color:var(--mute)}
.sugg li.none{padding:12px;color:var(--mute)}
.sugg a{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;padding:0 12px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.sugg a .n{font-family:var(--mincho);font-size:16px}
.sugg a .p{font-size:13px;color:var(--mute);white-space:nowrap}
.sugg a:hover{background:var(--bg)}
main{padding:20px 0 8px}
.lv{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lbl{font-size:13px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.x{color:var(--mute)}
a.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-decoration:none;font-family:var(--mincho);font-size:16px;line-height:1.3}
span.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--mincho);font-size:16px;color:var(--mute)}
.s{font-family:system-ui,-apple-system,sans-serif;margin-right:4px}
.mom{border-color:var(--mom)!important}.mom>.s{color:var(--mom)}
.dad{border-color:var(--dad)!important}.dad>.s{color:var(--dad)}
.unk{border-color:var(--unk)!important;border-style:dashed!important}
.sel{border-color:var(--sel)!important;border-style:dotted!important;border-width:2px!important}
.box{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.box a.chip,.box span.chip{min-height:36px;font-size:14px;padding:2px 8px}
.alt{width:100%;border:2px dotted var(--alt);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:10px}
.alt .lbl{color:var(--alt)}
.alt a.chip,.alt span.chip,.alt .box{border-color:var(--alt);border-style:dotted;border-width:2px}
.src{font-size:13px;color:var(--mute)}
.say{color:var(--mute);font-size:15px}
.stem{width:1px;height:18px;background:var(--line);margin:6px auto}
.center h2{margin:0;font-family:var(--mincho);font-size:28px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.center .sub{font-size:13px;color:var(--mute)}
.center .born{font-size:15px}
.kids .more{min-height:40px;padding:4px 12px;border:none;background:none;color:var(--dad);font-size:15px;text-decoration:underline;cursor:pointer}
.card{margin:22px 0 0;padding:14px 0 0;border-top:1px solid var(--line);font-size:15px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px}
.card dt{font-size:13px;color:var(--mute);white-space:nowrap;padding-top:1px}
.card dd{margin:0}
.linkbtn{border:none;background:none;padding:0 0 0 4px;color:var(--dad);font-size:13px;text-decoration:underline;cursor:pointer}
footer{margin:28px 0 32px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.7}
footer p{margin:0 0 6px}
footer a{color:var(--mute);word-break:break-all}
.mago{margin-left:6px;font-family:system-ui,-apple-system,sans-serif;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:1.4}
</style>
</head>

  <main id="view"></main>

    <p>親の情報は農研機構イネ品種データベースと各県の試験場の報告などで照合しました</p>

</div>

const HOME = "山田錦";
const V = new Map(D.varieties.map(v => [v.name, v]));
const N = new Map(D.nodes.map(n => [n.name, n]));

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function href(name){ return "#" + encodeURIComponent(name); }
function isCenterable(name){ return V.has(name) || (N.has(name) && N.get(name).kind === "name"); }
function isInter(name){ return N.has(name) && N.get(name).kind === "inter"; }
function firstYear(v){ return v && v.year ? v.year : null; }

/* ---------- かっこの深さを数えて切る ---------- */
const OPEN = "（(", CLOSE = "）)";
function splitTop(s, sep){
  const out = []; let d = 0, cur = "";
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(OPEN.includes(c)) d++;
    else if(CLOSE.includes(c)) d = Math.max(0, d - 1);
    if(d === 0 && s.startsWith(sep, i)){ out.push(cur); cur = ""; i += sep.length - 1; continue; }
    cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(x => x);
}
// 末尾の（…）を1つ外す → [残り, 中身] / null
function peelLast(s){
  s = s.trim();
  if(!(s.endsWith("）") || s.endsWith(")"))) return null;
  let d = 0;
  for(let i = s.length - 1; i >= 0; i--){
    const c = s[i];
    if(CLOSE.includes(c)) d++;
    else if(OPEN.includes(c)){ d--; if(d === 0) return [s.slice(0, i).trim(), s.slice(i + 1, -1)]; }
  }
  return null;
}

/* ---------- 親の式：♀A × ♂B ／ A / B（向き不明） ／ X（選抜・変異の元） ---------- */
function stripSym(s){ return s.trim().replace(/^[♀♂]\s*/, "").trim(); }
function unwrap(s){
  if(s.startsWith("(") || s.startsWith("（")){
    const p = peelLast(s);
    if(p && p[0] === "") return p[1];
  }
  return null;
}
function parseExpr(s){
  s = s.trim();
  const p = peelLast(s);
  if(p && p[1] === "向き不明") return {t:"unk", xs: splitTop(p[0], "/").map(parseTerm)};
  if(p && p[1] === "選抜・変異の元") return {t:"sel", x: parseTerm(p[0])};
  const xs = splitTop(s, "×");
  if(xs.length === 2) return {t:"pair", m: parseTerm(xs[0]), f: parseTerm(xs[1])};
  return {t:"names", xs: splitTop(s, "・").map(n => ({t:"name", name: n}))};
}
function parseTerm(s){
  const b = stripSym(s), inner = unwrap(b);
  return inner !== null ? parseExpr(inner) : {t:"name", name: b};
}
function canon(e){
  if(!e) return "";
  switch(e.t){
    case "name": return isInter(e.name) ? canon(nodeExpr(N.get(e.name))) : e.name;
    case "pair": return "[♀" + canon(e.m) + "×♂" + canon(e.f) + "]";
    case "unk": return "{" + e.xs.map(canon).sort().join("/") + "}";
    case "sel": return "元:" + canon(e.x);
    case "names": return e.xs.map(canon).join("・");
  }
  return "";
}
// データの親（alt を除く）から式を作る
function nodeExpr(item){
  const ps = (item.parents || []).filter(p => p.role !== "alt");
  const mom = ps.find(p => p.role === "母"), dad = ps.find(p => p.role === "父");
  if(mom && dad) return {t:"pair", m:{t:"name", name: mom.name}, f:{t:"name", name: dad.name}};
  const unk = ps.filter(p => p.role === "不明");
  if(unk.length >= 2) return {t:"unk", xs: unk.map(p => ({t:"name", name: p.name}))};
  const sel = ps.find(p => p.role === "元");
  if(sel) return {t:"sel", x:{t:"name", name: sel.name}};
  return null;
}

/* ---------- 食い違い：どちらにも決めず並べる（式と資料名は生成側で作ってある） ---------- */
const GROUP = {book: "本の別の頁では", other: "別の資料では"};
function altGroups(v){
  const alts = (v.parents || []).filter(p => p.role === "alt");
  if(!v.conf && !alts.length) return [];
  const mainC = canon(nodeExpr(v));
  const mainNames = new Set((v.parents || []).filter(p => p.role !== "alt").map(p => p.name));
  const out = {book: [], other: []}, seen = new Map();   // 同じ親の組は1つにまとめ、資料を並べる
  const addExpr = (g, e, src) => {
    const c = canon(e);
    if(!c || c === mainC) return;
    const o = seen.get(g + c);
    if(o){ if(!o.srcs.includes(src)) o.srcs.push(src); return; }
    const n = {e, srcs:[src]}; seen.set(g + c, n); out[g].push(n);
  };
  for(const it of (v.conf || [])){
    if(it.names){
      const ns = splitTop(it.e, "・").filter(n => !mainNames.has(n));
      if(ns.length) addExpr(it.g, {t:"names", xs: ns.map(n => ({t:"name", name: n}))}, it.src);
    } else addExpr(it.g, parseExpr(it.e), it.src);
  }
  // 文から拾えなかった別の親も落とさない
  const shown = new Set();
  const walk = e => { if(!e) return; if(e.t === "name") shown.add(e.name); (e.xs || []).forEach(walk); walk(e.m); walk(e.f); walk(e.x); };
  out.book.concat(out.other).forEach(o => walk(o.e));
  const rest = alts.map(p => p.name).filter(n => !shown.has(n));
  if(rest.length) out.other.push({e:{t:"names", xs: rest.map(n => ({t:"name", name: n}))}, srcs: ["ほかの資料による"]});
  return ["book", "other"].filter(g => out[g].length).map(g => ({head: GROUP[g], list: out[g]}));
}

/* ---------- 描く ---------- */
function symHTML(sym){ return sym ? '<span class="s">' + sym + '</span>' : ""; }
function chip(name, cls, sym, mark){
  if(isInter(name)) return interBox(name, cls, sym);
  const mk = mark ? '<small class="mago">' + mark + '</small>' : "";
  if(isCenterable(name)) return '<a class="chip ' + (cls || "") + '" href="' + href(name) + '">' + symHTML(sym) + esc(name) + mk + '</a>';
  return '<span class="chip ' + (cls || "") + '">' + symHTML(sym) + esc(name) + '</span>';
}
// 名前のない中間：箱の中に ♀A × ♂B を小さく（箱は中心にならない）
function interBox(name, cls, sym){
  const e = nodeExpr(N.get(name));
  return '<span class="box ' + (cls || "") + '">' + symHTML(sym) + (e ? exprInner(e) : esc(name)) + '</span>';
}
function termHTML(t, cls, sym){
  if(t.t === "name") return chip(t.name, cls, sym);
  return '<span class="box ' + (cls || "") + '">' + symHTML(sym) + exprInner(t) + '</span>';
}
function exprInner(e){
  switch(e.t){
    case "pair": return termHTML(e.m, "mom", "♀") + '<span class="x">×</span>' + termHTML(e.f, "dad", "♂");
    case "unk": return e.xs.map(x => termHTML(x, "unk")).join('<span class="x">/</span>');
    case "sel": return termHTML(e.x, "sel");
    case "names": return e.xs.map(x => termHTML(x, "")).join("");
  }
  return "";
}
function exprLine(e){
  let lbl = "";
  if(e.t === "unk") lbl = '<div class="lbl">親（どちらが母かは不明）</div>';
  if(e.t === "sel") lbl = '<div class="lbl">選び出した元</div>';
  if(e.t === "names" && e.xs.length === 1) return '<div class="row"><span class="lbl">片親：</span>' + exprInner(e) + '</div>';
  return lbl + '<div class="row">' + exprInner(e) + '</div>';
}
function parentsHTML(item){
  const v = V.get(item.name);
  const ps = (item.parents || []).filter(p => p.role !== "alt");
  let h = "";
  if(v && v.root && !ps.length){
    h += '<div class="say">' + esc(v.root) + '</div>';
  } else {
    const e = nodeExpr(item), sys = ps.filter(p => p.role === "系");
    if(e) h += exprLine(e);
    else if(sys.length) h += '<div class="lbl">元になった品種</div><div class="row">' + sys.map(p => chip(p.name, "unk")).join("") + '</div>';
    else if(ps.length) h += '<div class="row">' + ps.map(p => chip(p.name, "")).join("") + '</div>';
    else h += '<div class="say">親は分かっていない</div>';
  }
  for(const g of (v ? altGroups(v) : [])){
    h += '<div class="alt"><div class="lbl">' + g.head + '</div>' +
      g.list.map(a => '<div>' + exprLine(a.e) + a.srcs.map(x => '<div class="src">' + esc(x) + '</div>').join("") + '</div>').join("") + '</div>';
  }
  return '<section class="lv parents">' + h + '</section>';
}
// 子：名前のない中間を飛ばして、その先の名前のある品種を出す（中間を挟んだ先は孫の印を付ける）
function namedChildren(list){
  const direct = [], deep = [], seen = new Set();
  const walk = (xs, d) => {
    for(const c of xs){
      if(isInter(c)){ if(!seen.has(c)){ seen.add(c); walk(N.get(c).children || [], true); } }
      else (d ? deep : direct).push(c);
    }
  };
  walk(list, false);
  return {all: [...new Set(direct.concat(deep))], grand: new Set(deep.filter(c => !direct.includes(c)))};
}
function byYear(a, b){
  const ya = firstYear(V.get(a)), yb = firstYear(V.get(b));
  if(ya !== yb){ if(ya === null) return 1; if(yb === null) return -1; return ya < yb ? -1 : 1; }
  return a.localeCompare(b, "ja");
}
const KIDS_MAX = 12;
function childrenHTML(item, showAll){
  const nk = namedChildren(item.children || []), grand = nk.grand;
  const kids = nk.all.sort(byYear);
  const altKids = namedChildren(item.children_alt || []).all.filter(k => !kids.includes(k)).sort(byYear);
  if(!kids.length && !altKids.length) return "";
  let h = "";
  if(kids.length){
    const vis = showAll ? kids : kids.slice(0, KIDS_MAX);
    h += '<div class="lbl">子</div><div class="row">' + vis.map(k => chip(k, "", "", grand.has(k) ? "孫" : "")).join("") + '</div>';
    if(!showAll && kids.length > KIDS_MAX) h += '<button class="more" id="moreKids" type="button">… ほか' + (kids.length - KIDS_MAX) + '品種</button>';
  }
  if(altKids.length){
    h += '<div class="alt"><div class="lbl">別の資料では、この品種の子</div><div class="row">' + altKids.map(k => chip(k, "")).join("") + '</div></div>';
  }
  return '<div class="stem"></div><section class="lv kids">' + h + '</section>';
}
function bornHTML(v){
  const y = firstYear(v), pref = v.pref || "";
  const line = [pref, y ? y + "年" : ""].filter(Boolean).join("・");
  return (line ? '<div class="born">' + esc(line) + '</div>' : "") + (v.breeder ? '<div class="sub">' + esc(v.breeder) + '</div>' : "");
}
function sourceHTML(v, showPages){
  const ls = v.src || [];
  let h = "";
  ls.forEach((x, i) => {
    h += '<div>' + esc(x);
    if(i === 0 && v.pages) h += showPages ? '<div>' + v.pages.map(p => "p." + p).join("・") + '</div>' : ' <button class="linkbtn" id="morePages" type="button">ほか</button>';
    h += '</div>';
  });
  return h;
}
function cardHTML(v, st){
  const rows = [];
  const cult = Object.entries(v.cult || {}).sort((a, b) => b[1] - a[1]);
  let c;
  if(!cult.length) c = "令和7年産の記録なし";
  else {
    c = esc(cult.slice(0, 5).map(x => x[0]).join("・")) + (cult.length > 5 ? "…ほか" + (cult.length - 5) + "県" : "");
    c += '<div>全国 ' + (v.cult_total >= 1 ? v.cult_total.toLocaleString("ja-JP") + " t" : "1 t未満") + '（令和7年産）</div>';
  }
  rows.push(["作っている県", c]);
  if(v.cat) rows.push(["区分", esc(v.cat)]);
  if(v.year_note) rows.push(["年について", esc(v.year_note)]);
  rows.push(["出典", '<div class="src">' + sourceHTML(v, st.pages) + '</div>']);
  return '<section class="card"><dl>' + rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join("") + '</dl></section>';
}

let cur = null, st = {kids:false, pages:false};
function render(){
  const v = V.get(cur), item = v || N.get(cur);
  let h = parentsHTML(item) + '<div class="stem"></div><section class="lv center"><h2>' + esc(cur) + '</h2>';
  if(v){
    if(!v.inbook) h += '<div class="sub">本に載っていない品種</div>';
    if(v.aliases && v.aliases.length) h += '<div class="sub">別名 ' + esc(v.aliases.join("／")) + '</div>';
    h += bornHTML(v);
  }
  h += '</section>' + childrenHTML(item, st.kids);
  if(v) h += cardHTML(v, st);
  document.getElementById("view").innerHTML = h;
  const mk = document.getElementById("moreKids");
  if(mk) mk.onclick = () => { st.kids = true; render(); };
  const mp = document.getElementById("morePages");
  if(mp) mp.onclick = () => { st.pages = true; render(); };
}
function fromHash(){
  let name = "";
  try { name = decodeURIComponent(location.hash.slice(1)); } catch(e) { name = ""; }
  if(!isCenterable(name)){
    if(location.hash) history.replaceState(null, "", location.pathname + location.search + href(HOME));
    name = HOME;
  }
  if(name !== cur){ cur = name; st = {kids:false, pages:false}; render(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", fromHash);

/* ---------- 探す ---------- */
function norm(s){
  return String(s).normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, "");
}
const POOL = D.varieties.map(v => ({name: v.name, pref: v.pref || "", total: v.cult_total || 0, key: norm(v.name)}))
  .concat(D.nodes.filter(n => n.kind === "name").map(n => ({name: n.name, pref: "", total: 0, key: norm(n.name)})));
const PREFS = new Set();
D.varieties.forEach(v => { if(v.pref) PREFS.add(v.pref); Object.keys(v.cult || {}).forEach(p => PREFS.add(p)); });
const byAmount = (a, b) => (b.total - a.total) || (a.name.length - b.name.length) || a.name.localeCompare(b.name, "ja");

const qEl = document.getElementById("q"), sEl = document.getElementById("sugg");
let firstHit = null;
function li(o){ return '<li><a href="' + href(o.name) + '"><span class="n">' + esc(o.name) + '</span><span class="p">' + esc(o.pref) + '</span></a></li>'; }
function suggest(){
  const raw = qEl.value.trim(), q = norm(raw);
  let h = "", first = null;
  if(!q){
    const top = POOL.filter(o => o.total > 0).sort(byAmount).slice(0, 10);
    h = '<li class="h">よく作られている品種</li>' + top.map(li).join("");
    first = top[0] || null;
  } else {
    let pref = null;
    if(PREFS.has(raw)) pref = raw;
    else { const s = raw.replace(/[県府都]$/, ""); if(PREFS.has(s)) pref = s; }
    const hits = POOL.filter(o => o.key.includes(q)).sort(byAmount);
    if(pref){
      const grown = D.varieties.filter(v => v.cult && pref in v.cult)
        .sort((a, b) => (b.cult[pref] - a.cult[pref]) || a.name.localeCompare(b.name, "ja")).slice(0, 20)
        .map(v => ({name: v.name, pref: v.pref || ""}));
      if(grown.length) h += '<li class="h">' + esc(pref) + 'で作っている品種</li>' + grown.map(li).join("");
      const inGrown = new Set(grown.map(o => o.name));
      const rest = hits.filter(o => !inGrown.has(o.name));
      if(rest.length) h += '<li class="h">名前に「' + esc(raw) + '」を含む品種</li>' + rest.slice(0, 8).map(li).join("");
      first = grown[0] || hits[0] || null;
      if(!h) h = '<li class="none">見つかりません</li>';
    } else {
      const top = hits.slice(0, 8);
      h = top.length ? top.map(li).join("") : '<li class="none">見つかりません</li>';
      first = top[0] || null;
    }
  }
  firstHit = first;
  sEl.innerHTML = h;
  sEl.hidden = false;
}
function closeSugg(){ sEl.hidden = true; }
function go(name){ closeSugg(); qEl.value = ""; qEl.blur(); if(name !== cur) location.hash = encodeURIComponent(name); }
qEl.addEventListener("focus", suggest);
qEl.addEventListener("input", suggest);
qEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); if(firstHit) go(firstHit.name); }
  else if(e.key === "Escape"){ closeSugg(); qEl.blur(); }
});
qEl.addEventListener("blur", () => setTimeout(closeSugg, 150));
sEl.addEventListener("mousedown", e => e.preventDefault());
sEl.addEventListener("click", e => {
  const a = e.target.closest("a"); if(!a) return;
  e.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});

fromHash();
</script>
